# Lint, typecheck, build and test on every push and pull request. The last
# step proves the committed plugin bundle under plugins/ matches a fresh build.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build the plugin bundle
        run: npm run build

      - name: Test
        run: npm test

      - name: The committed bundle matches the build
        run: git diff --exit-code -- plugins/
